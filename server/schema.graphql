type AuthPayload {
  """
  Bearer token for the new session. Null when the e-mail must be confirmed first.
  """
  token: String
  user: User!
}

type ChatMessage {
  createdAt: DateTime!
  id: Int!
  message: String!
  sender: User!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

scalar File

type GameMap {
  active: Boolean!
  imageUrl: String
  name: String!
  slug: ID!
  sortOrder: Int!
}

enum ImageTarget {
  AVATAR
  TEAM
  TOURNAMENT
}

enum InviteStatus {
  ACCEPTED
  DECLINED
  PENDING
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

type Match {
  bans: [MatchBan!]!
  firstBanTeam: Int
  id: Int!
  map: GameMap
  mapSlug: String
  phase: MatchPhase!
  phaseEndsAt: DateTime
  phaseStartedAt: DateTime!
  position: Int!
  registration1: Registration
  registration1Id: Int
  registration2: Registration
  registration2Id: Int
  serverAddress: String
  team1Ready: Boolean!
  team2Ready: Boolean!
  tournament: Tournament!
  tournamentId: Int!
  winner: Int
}

type MatchBan {
  automatic: Boolean!
  createdAt: DateTime!
  id: Int!
  mapSlug: String!
  ordinal: Int!
  team: Int!
}

enum MatchPhase {
  CANCELLED
  FINISHED
  IN_PROGRESS
  PICK_AND_BAN
  READY_CHECK
  WAITING_FOR_TEAMS
  WAITING_TO_START
}

type Mutation {
  addMap(imageUrl: String, name: String!): GameMap!
  banMap(map: String!, matchId: Int!): Boolean!
  changeEmail(email: String!, password: String!): User!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!
  createTeam(name: String!): Team!
  createTournament(input: TournamentInput!): Tournament!
  deleteTournament(id: Int!): Boolean!
  generateBracket(tournamentId: Int!): Boolean!
  inviteToTeam(recipientId: ID!, teamId: Int!): TeamInvite!
  leaveTeam(teamId: Int!): Boolean!
  leaveTournament(tournamentId: Int!): Boolean!
  linkSteam(params: JSON!): User!
  logIn(email: String!, password: String!): AuthPayload!
  logOut: Boolean!
  markNotificationsSeen: Boolean!
  markReady(matchId: Int!): Boolean!
  registerForTournament(teamId: Int!, tournamentId: Int!): Registration!
  removeRegistration(registrationId: Int!): Boolean!
  removeTeamMember(teamId: Int!, userId: ID!): Boolean!
  reportMatchWinner(matchId: Int!, winner: Int!): Boolean!
  requestPasswordReset(email: String!): Boolean!
  resendVerification(email: String!): Boolean!
  resetPassword(password: String!, token: String!): Boolean!
  respondToInvite(accept: Boolean!, inviteId: Int!): TeamInvite!
  restartMatch(matchId: Int!): Boolean!
  sendChatMessage(matchId: Int!, message: String!): ChatMessage!
  setMatchServer(address: String, matchId: Int!): Boolean!
  setTournamentPublished(id: Int!, published: Boolean!): Tournament!
  setUserRole(role: UserRole!, userId: ID!): User!
  signUp(email: String!, password: String!, playertag: String!): AuthPayload!
  startTournament(tournamentId: Int!): Boolean!
  unlinkSteam: User!
  updateMap(active: Boolean, imageUrl: String, slug: String!): GameMap!
  updateProfile(description: String!): User!
  updateTournament(id: Int!, input: TournamentInput!): Tournament!

  """
  Uploads a picture for your profile, a team you own or (staff) a tournament. Returns the new URL.
  """
  uploadImage(file: File!, id: Int, target: ImageTarget!): String
  verifyEmail(token: String!): AuthPayload!
}

type Notification {
  createdAt: DateTime!
  id: Int!
  invite: TeamInvite
  seen: Boolean!
  type: NotificationType!
}

enum NotificationType {
  INVITE_TO_TEAM
}

type Query {
  invitesFor(userId: ID!): [TeamInvite!]!
  maps: [GameMap!]!
  match(id: Int!): Match
  matchChat(matchId: Int!): [ChatMessage!]!
  me: User
  myActiveRegistrations: [Registration!]!
  myRegistration(tournamentId: Int!): Registration
  myTeams: [Team!]!
  notifications: [Notification!]!
  player(playertag: String!): User
  players: [User!]!
  playertagAvailable(playertag: String!): Boolean!
  search(query: String!, type: SearchType = ALL): SearchResult!
  team(id: Int!): Team
  teams: [Team!]!
  tournament(id: Int!): Tournament
  tournaments: [Tournament!]!
}

type Registration {
  captainId: ID!
  createdAt: DateTime!
  currentMatch: Match
  id: Int!
  players: [User!]!
  team: Team!
  tournament: Tournament!
  tournamentId: Int!
}

type SearchResult {
  players: [User!]!
  teams: [Team!]!
  tournaments: [Tournament!]!
}

enum SearchType {
  ALL
  PLAYERS
  TEAMS
  TOURNAMENTS
}

type Subscription {
  chatMessageAdded(matchId: Int!): Boolean!
  matchChanged(matchId: Int!): Boolean!
  myActivityChanged: Boolean!
  notificationsChanged: Boolean!
  tournamentChanged(tournamentId: Int!): Boolean!
}

type Team {
  avatarUrl: String
  createdAt: DateTime!
  id: Int!
  losses: Int!
  memberCount: Int!
  members: [User!]!
  name: String!
  owner: User!
  ownerId: ID!
  wins: Int!
}

type TeamInvite {
  createdAt: DateTime!
  id: Int!
  recipient: User!
  sender: User!
  status: InviteStatus!
  team: Team!
}

type Tournament {
  createdAt: DateTime!
  description: String!
  format: TournamentFormat!
  id: Int!
  matches: [Match!]!
  maxTeams: Int!
  name: String!
  pictureUrl: String
  published: Boolean!
  registrationCount: Int!
  registrations: [Registration!]!
  rules: String!
  startsAt: DateTime!
  status: TournamentStatus!
}

enum TournamentFormat {
  SINGLE_ELIMINATION
}

input TournamentInput {
  description: String!
  maxTeams: Int!
  name: String!
  published: Boolean!
  rules: String!
  startsAt: DateTime!
  status: TournamentStatus
}

enum TournamentStatus {
  CLOSED_FOR_REGISTRATIONS
  FINISHED
  IN_PROGRESS
  OPEN_FOR_REGISTRATIONS
}

type User {
  avatarUrl: String
  createdAt: DateTime!
  description: String!
  email: String
  emailVerified: Boolean
  id: ID!
  playertag: String!
  role: UserRole!
  steamId: String
  teams: [Team!]!
}

enum UserRole {
  ADMIN
  ORGANIZER
  USER
}
