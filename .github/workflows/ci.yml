name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cssundays_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cssundays_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cssundays_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # One lockfile for the whole workspace, installed from the repository root.
      - run: npm ci
        working-directory: .
      - run: npm run build
      - run: npm test
      # The committed schema must match the code (the frontend's types are generated from it).
      - run: npm run schema:print && git diff --exit-code schema.graphql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # One lockfile for the whole workspace, installed from the repository root.
      - run: npm ci
        working-directory: .
      - run: npm run gen:graphql && git diff --exit-code src/graphql-env.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com
