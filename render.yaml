# Render blueprint for the CSSundays API (free web service).
# Create it from the Render dashboard: New → Blueprint → this repository.
services:
  - type: web
    name: cssundays-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    # Apply pending migrations on every deploy, then start the API.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon pooled connection string (…-pooler…)
      - key: DIRECT_DATABASE_URL
        sync: false # Neon direct connection string, used for migrations
      - key: APP_ORIGINS
        sync: false # e.g. https://cssundays.dk,https://www.cssundays.dk
      - key: PUBLIC_API_URL
        sync: false # e.g. https://cssundays-api.onrender.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. CSSundays <noreply@cssundays.dk>
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: IMAGE_BASE_URL
        sync: false # public URL of the R2 bucket
      - key: DATHOST_EMAIL
        sync: false # optional: automatic match servers
      - key: DATHOST_PASSWORD
        sync: false
      - key: DATHOST_LOCATION
        sync: false # e.g. copenhagen
      - key: DATHOST_WEBHOOK_URL
        sync: false # e.g. https://api.cssundays.dk/webhooks/dathost
      - key: DATHOST_WEBHOOK_SECRET
        generateValue: true
